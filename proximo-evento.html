<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#090909">
  <title>Próximo evento — Only Cars Club</title>
  <link rel="icon" href="assets/images/logotipo-only-branco-color.png">
  <link rel="stylesheet" href="assets/css/style.css?v=20260727-1">
  <style>
    html, body, main { animation: none !important; transition: none !important; }
    .next-event-history {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: clamp(2rem, 5vw, 3.5rem);
      text-align: center;
    }
    .next-event-history .eyebrow { margin-bottom: .8rem; }
    .next-event-history .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-inline: auto;
    }
  </style>
  <script>
    document.addEventListener("click", function (event) {
      const link = event.target.closest("a[href]");
      if (!link || link.target === "_blank" || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      const url = new URL(link.href, window.location.href);
      if (url.origin !== window.location.origin) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.location.href = url.href;
    }, true);
  </script>
  <script src="assets/js/main.js?v=20260727-1" defer></script>
</head>
<body data-page="proximo-evento" class="next-event-page">
  <header class="header">
    <a href="index.html" class="brand" aria-label="Only Cars Club — início">
      <img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club">
    </a>
  </header>

  <nav class="bottom-nav" aria-label="Navegação principal"></nav>

  <main class="next-event-main">
    <section class="next-event-waiting" aria-labelledby="next-event-title">
      <div class="waiting-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <p class="eyebrow">Próximo evento</p>
      <h1 id="next-event-title">Algo está<br><em>sendo preparado.</em></h1>
      <p>Assim que a próxima data estiver confirmada, todos os detalhes aparecem aqui.</p>
      <span class="waiting-status"><i aria-hidden="true"></i>Aguardando nova data</span>
      <div class="next-event-history">
        <p class="eyebrow">Enquanto isso...</p>
        <a class="button primary" href="eventos.html">Conheça nossos outros eventos <span>↗</span></a>
      </div>
    </section>
  </main>
</body>
</html>
