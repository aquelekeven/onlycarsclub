<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#090909">
  <title>Pagamento — Only Cars Club</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=20260729-v65">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=20260729-v63">
  <link rel="manifest" href="manifest.webmanifest?v=20260729-v63">
  <link rel="stylesheet" href="assets/css/style.css?v=20260728-v53">
  <script src="assets/js/main.js?v=20260730-v68" defer></script>
</head>
<body data-page="loja">
<header class="header"><a href="index.html" class="brand"><img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"></a><a class="cart-shortcut active" href="carrinho.html" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span data-cart-count>0</span></a></header>
<main class="checkout-page">
  <section class="checkout-heading">
    <p class="eyebrow">Etapa 4 de 4</p>
    <h1>Como você quer pagar?</h1>
    <p>O pagamento será combinado e confirmado pelo WhatsApp.</p>
    <ol class="checkout-steps" data-checkout-steps data-current-step="4" aria-label="Etapas da compra">
      <li data-step="1"><a href="loja.html" aria-label="Ir para produtos"><span>1</span><b>Produtos</b></a></li>
      <li data-step="2"><a href="carrinho.html" aria-label="Ir para o carrinho"><span>2</span><b>Carrinho</b></a></li>
      <li data-step="3"><a href="entrega.html" aria-label="Ir para entrega"><span>3</span><b>Entrega</b></a></li>
      <li data-step="4"><a href="pagamento.html" aria-label="Ir para pagamento"><span>4</span><b>Pagamento</b></a></li>
    </ol>
  </section>
  <form class="checkout-options" data-payment-form>
    <label class="checkout-option">
      <input type="radio" name="payment" value="Pix" required>
      <span class="checkout-option-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 4-4 4 4M8 19l4 4 4-4M5 8l-4 4 4 4M19 8l4 4-4 4"/><path d="m8 8 4-4 4 4 4 4-4 4-4 4-4-4-4-4Z"/></svg></span>
      <span><strong>Pix</strong><small>Os dados para pagamento serão enviados no atendimento.</small></span>
      <i aria-hidden="true"></i>
    </label>
    <label class="checkout-option">
      <input type="radio" name="payment" value="Cartão — sujeito a taxas" required>
      <span class="checkout-option-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg></span>
      <span><strong>Cartão</strong><small>Sujeito às taxas informadas durante o atendimento.</small></span>
      <i aria-hidden="true"></i>
    </label>
    <div class="checkout-order-total"><span>Total dos produtos</span><strong data-checkout-total>R$ 0,00</strong></div>
    <p class="checkout-error" data-checkout-error role="alert"></p>
    <button class="checkout-next" type="submit">Finalizar pelo WhatsApp</button>
    <a class="checkout-back" href="entrega.html">Voltar para entrega</a>
  </form>
</main>
</body>
</html>
