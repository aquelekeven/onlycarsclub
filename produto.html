<main class="product-page">
  <a class="product-back" href="loja.html" aria-label="Voltar para a loja">←</a>
  <section class="product-detail">
    <div class="product-gallery">
      <div class="product-detail-image" data-product-gallery>
        <img decoding="async" data-product-image src="assets/images/camiseta-oversized-frente-modelo.webp?v=20260728-v53" alt="">
        <button class="product-gallery-control previous" type="button" data-product-previous aria-label="Foto anterior">‹</button>
        <button class="product-gallery-control next" type="button" data-product-next aria-label="Próxima foto">›</button>
        <span class="product-gallery-count" data-product-gallery-count aria-live="polite"></span>
      </div>
      <div class="product-gallery-progress" data-product-gallery-progress role="progressbar" aria-label="Posição na galeria de fotos" aria-valuemin="1"></div>
    </div>
    <form class="product-info" data-product-form>
      <p class="eyebrow" data-product-category>Only Cars Supply</p>
      <h1 data-product-name>Produto Only Cars</h1>
      <div class="product-detail-pricing" aria-label="Preço com 10% de desconto e preço normal">
        <span class="product-detail-discount">10% OFF</span>
        <div class="product-detail-price-row">
          <strong class="product-detail-price" data-product-price>R$ 0,00</strong>
          <del data-product-original-price>R$ 0,00</del>
        </div>
      </div>
      <p class="product-description" data-product-description>Produto oficial Only Cars Club.</p>
      <div class="product-availability" data-product-availability aria-live="polite">
        <span class="product-availability-icon" aria-hidden="true"></span>
        <span>
          <strong data-product-availability-title></strong>
          <small data-product-availability-text></small>
        </span>
      </div>
      <fieldset data-size-field>
        <legend>Tamanho</legend>
        <div class="option-row" data-size-options></div>
      </fieldset>
      <fieldset data-variant-field>
        <legend data-variant-legend>Variedade</legend>
        <div class="option-row" data-variant-options></div>
      </fieldset>
      <fieldset data-gift-field hidden>
        <legend>Escolha seu adesivo de brinde</legend>
        <div class="option-row" data-gift-options></div>
      </fieldset>
      <label class="quantity-label">Quantidade
        <span class="quantity-control"><button type="button" data-quantity-minus>−</button><input data-quantity type="number" min="1" max="99" value="1" aria-label="Quantidade"><button type="button" data-quantity-plus>+</button></span>
      </label>
      <button class="add-cart-button" type="submit">Adicionar ao carrinho</button>
      <p class="cart-feedback" data-cart-feedback role="status" aria-live="polite"></p>
    </form>
  </section>
