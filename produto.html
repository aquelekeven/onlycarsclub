<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Produto — Only Cars Club</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260728-security">
  <script src="assets/js/main.js?v=20260728-security" defer></script>
</head>
<body data-page="loja">
<header class="header">
  <a href="index.html" class="brand"><img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"></a>
  <a class="cart-shortcut" href="carrinho.html" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span data-cart-count>0</span></a>
</header>
<nav class="bottom-nav" aria-label="Navegação principal"></nav>
<main class="product-page">
  <a class="product-back" href="loja.html" aria-label="Voltar para a loja">←</a>
  <section class="product-detail">
    <div class="product-gallery">
      <div class="product-detail-image" data-product-gallery>
        <img data-product-image src="assets/images/camiseta-oversized-frente-modelo.webp?v=20260727-11" alt="">
        <button class="product-gallery-control previous" type="button" data-product-previous aria-label="Foto anterior">‹</button>
        <button class="product-gallery-control next" type="button" data-product-next aria-label="Próxima foto">›</button>
        <span class="product-gallery-count" data-product-gallery-count aria-live="polite"></span>
      </div>
      <div class="product-thumbnails" data-product-thumbnails aria-label="Fotos do produto"></div>
    </div>
    <form class="product-info" data-product-form>
      <p class="eyebrow" data-product-category>Only Cars Supply</p>
      <h1 data-product-name>Produto Only Cars</h1>
      <strong class="product-detail-price" data-product-price>R$ 0,00</strong>
      <p class="product-description" data-product-description>Produto oficial Only Cars Club.</p>
      <fieldset data-size-field>
        <legend>Tamanho</legend>
        <div class="option-row" data-size-options></div>
      </fieldset>
      <fieldset data-variant-field>
        <legend data-variant-legend>Variedade</legend>
        <div class="option-row" data-variant-options></div>
      </fieldset>
      <label class="quantity-label">Quantidade
        <span class="quantity-control"><button type="button" data-quantity-minus>−</button><input data-quantity type="number" min="1" max="99" value="1" aria-label="Quantidade"><button type="button" data-quantity-plus>+</button></span>
      </label>
      <button class="add-cart-button" type="submit">Adicionar ao carrinho</button>
      <p class="cart-feedback" data-cart-feedback role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<aside class="cart-toast" data-cart-toast role="status" aria-live="polite" aria-hidden="true">
  <span class="cart-toast-icon">✓</span>
  <span><strong>Adicionado ao carrinho</strong><small data-cart-toast-text></small></span>
  <a href="carrinho.html">Ver carrinho</a>
</aside>
<footer class="footer"><img class="brand-logo footer-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"><p>Cultura automotiva, comunidade e respeito.</p><small>© 2026 Only Cars Club. Todos os direitos reservados.</small></footer>
</body>
</html>
