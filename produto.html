<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Produto — Only Cars Club</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260724-8">
  <script src="assets/js/main.js?v=20260724-6" defer></script>
</head>
<body data-page="loja">
<header class="header"><a href="index.html" class="brand"><img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"></a><a class="cart-shortcut" href="carrinho.html" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span data-cart-count>0</span></a></header>
<nav class="bottom-nav"><a href="index.html" data-page="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Início</span></a><a href="loja.html" data-page="loja"><svg viewBox="0 0 24 24"><path d="M4 9v11h16V9M3 9l2-5h14l2 5M8 9a4 4 0 0 0 8 0M9 20v-6h6v6"/></svg><span>Loja</span></a><a href="sobre.html" data-page="sobre"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-5 3.2-7 8-7s7.5 2 8 7"/></svg><span>O clube</span></a><a href="contato.html" data-page="contato"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4Z"/><path d="m5 6 7 6 7-6"/></svg><span>Contato</span></a></nav>
<main class="product-page">
  <a class="product-back" href="loja.html" aria-label="Voltar para a loja">←</a>
  <section class="product-detail">
    <div class="product-detail-image"><img data-product-image src="assets/images/teste.png" alt=""></div>
    <form class="product-info" data-product-form>
      <p class="eyebrow" data-product-category>Only Cars Supply</p>
      <h1 data-product-name>Produto Only Cars</h1>
      <strong class="product-detail-price" data-product-price>R$ 0,00</strong>
      <p class="product-description" data-product-description>Produto oficial Only Cars Club.</p>
      <fieldset data-size-field>
        <legend>Tamanho</legend>
        <div class="option-row" data-size-options></div>
      </fieldset>
      <fieldset>
        <legend data-variant-legend>Variedade</legend>
        <div class="option-row" data-variant-options></div>
      </fieldset>
      <label class="quantity-label">Quantidade
        <span class="quantity-control"><button type="button" data-quantity-minus>−</button><input data-quantity type="number" min="1" max="99" value="1" aria-label="Quantidade"><button type="button" data-quantity-plus>+</button></span>
      </label>
      <button class="add-cart-button" type="submit">Adicionar ao carrinho</button>
      <p class="cart-feedback" data-cart-feedback role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<aside class="cart-toast" data-cart-toast role="status" aria-live="polite" aria-hidden="true">
  <span class="cart-toast-icon">✓</span>
  <span><strong>Adicionado ao carrinho</strong><small data-cart-toast-text></small></span>
  <a href="carrinho.html">Ver carrinho</a>
</aside>
<footer class="footer"><img class="brand-logo footer-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"><p>Cultura automotiva, comunidade e respeito.</p><small>© 2026 Only Cars Club. Todos os direitos reservados.</small></footer>
</body>
</html>
