<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://wxxgcnyolpioyiaepkvs.supabase.co; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Minha conta — Only Cars Club</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260807-v107">
  <script src="assets/js/main.js?v=20260807-v93" defer></script>
  <script src="assets/js/supabase-client.js?v=20260807-v93" defer></script>
  <script src="assets/js/auth.js?v=20260807-v107" defer></script>
</head>
<body data-page="conta" data-account-page>
  <header class="header"><a href="index.html" class="brand"><img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"></a></header>
  <nav class="bottom-nav" aria-label="Navegação principal"></nav>
  <main class="account-page"><div class="account-wrap">
    <section class="account-state" data-account-loading><strong>Carregando sua conta...</strong><span>Aguarde só um instante.</span></section>
    <section class="account-state" data-account-guest hidden><strong>Você ainda não entrou.</strong><span>Faça login ou crie sua conta para acessar esta área.</span><div class="actions"><a class="button primary" href="login.html">Entrar</a><a class="button ghost" href="cadastro.html">Criar conta</a></div></section>
    <div data-account-content hidden>
      <header class="account-top"><div><p class="eyebrow">Minha conta</p><h1>Olá, <em data-account-name>cliente</em>.</h1><p data-account-email></p></div><div class="account-actions"><a class="account-admin-link" href="admin.html" data-admin-link hidden>Abrir painel</a><span class="account-role" data-account-role>Cliente</span><button class="account-logout" type="button" data-logout>Sair</button></div></header>
      <div class="account-grid">
        <section class="account-card"><h2>Meus dados</h2><form class="account-form" data-profile-form><div class="field"><label for="display_name">Nome completo</label><input id="display_name" name="display_name" autocomplete="name" required></div><div class="account-fields"><div class="field"><label for="phone">Telefone</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" data-mask="phone"></div><div class="field"><label for="tax_id">CPF</label><input id="tax_id" name="tax_id" inputmode="numeric" data-mask="cpf"></div></div><p class="form-feedback" data-form-feedback></p><button class="auth-submit" type="submit">Salvar dados</button></form></section>
        <section class="account-card"><h2>Endereço principal</h2><form class="account-form" data-address-form><div class="field"><label for="recipient_name">Nome do destinatário</label><input id="recipient_name" name="recipient_name" autocomplete="name" required></div><div class="account-fields"><div class="field"><label for="postal_code">CEP</label><input id="postal_code" name="postal_code" inputmode="numeric" autocomplete="postal-code" data-mask="cep" required></div><div class="field"><label for="state">Estado</label><input id="state" name="state" maxlength="2" autocomplete="address-level1" required></div><div class="field full"><label for="street">Rua</label><input id="street" name="street" autocomplete="address-line1" required></div><div class="field"><label for="number">Número</label><input id="number" name="number" required></div><div class="field"><label for="complement">Complemento</label><input id="complement" name="complement" autocomplete="address-line2"></div><div class="field"><label for="neighborhood">Bairro</label><input id="neighborhood" name="neighborhood" required></div><div class="field"><label for="city">Cidade</label><input id="city" name="city" autocomplete="address-level2" required></div></div><p class="form-feedback" data-form-feedback></p><button class="auth-submit" type="submit">Salvar endereço</button></form></section>
        <section class="account-card full"><h2>Meus pedidos</h2><div class="orders-list" data-orders-list></div></section>
      </div>
    </div>
  </div></main>
</body>
</html>
