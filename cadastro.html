<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://wxxgcnyolpioyiaepkvs.supabase.co; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Criar conta — Only Cars Club</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260808-typography-v122">
  <script src="assets/js/main.js?v=20260805-v75" defer></script>
  <script src="assets/js/supabase-client.js?v=20260805-v75" defer></script>
  <script src="assets/js/auth.js?v=20260805-v75" defer></script>
</head>
<body data-page="conta">
  <header class="header"><a href="index.html" class="brand" aria-label="Only Cars Club — início"><img class="brand-logo" src="assets/images/logotipo-only-branco-color.png" alt="Only Cars Club"></a></header>
  <nav class="bottom-nav" aria-label="Navegação principal"></nav>
  <main class="auth-page">
    <div class="auth-shell">
      <div class="auth-heading"><p class="eyebrow">Sua conta Only</p><h1>Chega<br><em>junto.</em></h1><p>Cadastre-se para salvar seus dados e acompanhar pedidos.</p></div>
      <section class="auth-card">
        <form class="auth-form" data-signup-form>
          <div class="field"><label for="name">Nome completo</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" required></div>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="password">Senha</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-toggle-password="password" aria-pressed="false">Mostrar</button></div></div>
          <div class="field"><label for="password_confirmation">Confirmar senha</label><div class="password-field"><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-toggle-password="password_confirmation" aria-pressed="false">Mostrar</button></div></div>
          <label class="auth-consent"><input name="privacy" type="checkbox" required><span>Li e aceito a <a href="privacidade.html">Política de Privacidade</a>.</span></label>
          <p class="form-feedback" data-form-feedback></p>
          <button class="auth-submit" type="submit">Criar conta</button>
        </form>
        <div class="auth-links"><span>Já tem cadastro?</span><a href="login.html">Entrar</a></div>
      </section>
    </div>
  </main>
</body>
</html>
