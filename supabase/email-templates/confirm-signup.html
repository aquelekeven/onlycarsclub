<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#090909;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background:#090909;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background:#111111;border:1px solid #2b2b2b;border-radius:24px;overflow:hidden;">
            <tr>
              <td align="center" style="padding:34px 28px 26px;border-bottom:1px solid #292929;">
                <img src="https://onlycarsclub.com.br/assets/images/logotipo-only-branco-color.png" width="220" alt="Only Cars Club" style="display:block;width:220px;max-width:80%;height:auto;border:0;">
              </td>
            </tr>
            <tr>
              <td style="padding:38px 34px 42px;">
                <p style="margin:0 0 12px;color:#efd311;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Sua conta Only</p>
                <h1 style="margin:0 0 18px;color:#ffffff;font-size:32px;line-height:1.15;">Confirme seu e-mail.</h1>
                <p style="margin:0 0 28px;color:#b8b8b8;font-size:16px;line-height:1.65;">Falta só um passo para finalizar seu cadastro no Only Cars Club. Clique no botão abaixo para confirmar seu endereço de e-mail.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:999px;background:#efd311;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 28px;color:#090909;font-size:13px;font-weight:800;letter-spacing:.6px;text-decoration:none;text-transform:uppercase;">Confirmar meu e-mail</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:30px 0 0;color:#777777;font-size:12px;line-height:1.6;">Se você não criou esta conta, pode ignorar esta mensagem.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:22px 28px;background:#0c0c0c;color:#777777;font-size:11px;line-height:1.6;">Não é só sobre carros. Isso é Only.<br>Only Cars Club</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
